name: Self scan

# Bộ quét tự quét chính nó, theo đúng cách một dự án bên ngoài gọi.
on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Test Dockerfile policy
        run: docker run --rm -v "$PWD:/p" -w /p openpolicyagent/conftest:v0.56.0 verify --policy policy --policy tests/policy

  scan:
    needs: test
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/scan.yml
    with:
      scanner-ref: ${{ github.sha }}
    secrets:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
