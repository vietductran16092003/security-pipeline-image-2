name: Security scan

# Reusable workflow. Dự án khác gọi bằng:
#   jobs:
#     scan:
#       uses: vietductran16092003/security-pipeline-image-2/.github/workflows/scan.yml@v1
#       secrets:
#         SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
#         SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
#         REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
on:
  workflow_call:
    inputs:
      scanner-ref:
        description: "Phiên bản bộ quét (tag, nhánh hoặc SHA) cần dùng"
        type: string
        default: "v1"
    secrets:
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      REPORT_EMAIL_TO:
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout dự án
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          fetch-depth: 0

      - name: Checkout bộ quét
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vietductran16092003/security-pipeline-image-2
          ref: ${{ inputs.scanner-ref }}
          path: scanner-src

      - name: Cài Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Cài thư viện bộ quét
        run: pip install -r scanner-src/requirements.txt

      - name: Quét
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: scanner-src
        run: python -P -m scanner run --root project --out ${{ runner.temp }}/scan-out --scanner-dir scanner-src

      - name: Ghi Job Summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/scan-out/summary.md" ]; then cat "${{ runner.temp }}/scan-out/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Lưu báo cáo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-report
          path: |
            ${{ runner.temp }}/scan-out/report.json
            ${{ runner.temp }}/scan-out/email.html
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Gửi email
        if: always()
        env:
          PYTHONPATH: scanner-src
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          if [ -f "${{ runner.temp }}/scan-out/email.html" ]; then python -P -m scanner send --out "${{ runner.temp }}/scan-out"; fi
