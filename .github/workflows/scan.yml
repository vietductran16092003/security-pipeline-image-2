name: Security scan

# Reusable workflow. Dự án khác gọi bằng:
#   jobs:
#     scan:
#       uses: vietductran16092003/security-scan-action/.github/workflows/scan.yml@v1
#       secrets:
#         SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
#         SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
#         REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
on:
  workflow_call:
    inputs:
      scanner-ref:
        description: "Phiên bản bộ quét (tag, nhánh hoặc SHA) cần dùng"
        type: string
        default: "v1"
    secrets:
      SMTP_USERNAME:
        required: false
      SMTP_PASSWORD:
        required: false
      REPORT_EMAIL_TO:
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout dự án
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Checkout bộ quét
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vietductran16092003/security-scan-action
          ref: ${{ inputs.scanner-ref }}
          path: .scanner

      - name: Cài Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Cài thư viện bộ quét
        run: pip install -r .scanner/requirements.txt

      - name: Quét
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: .scanner
        run: python -P -m scanner run --root . --out scan-out --scanner-dir .scanner

      - name: Ghi Job Summary
        if: always()
        run: |
          if [ -f scan-out/summary.md ]; then cat scan-out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Lưu báo cáo
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8c75cf6a5 # v4.4.3
        with:
          name: security-report
          path: |
            scan-out/report.json
            scan-out/email.html
          retention-days: 90
          overwrite: true
          if-no-files-found: warn

      - name: Gửi email
        if: always()
        env:
          PYTHONPATH: .scanner
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          if [ -f scan-out/email.html ]; then python -P -m scanner send --out scan-out; fi
